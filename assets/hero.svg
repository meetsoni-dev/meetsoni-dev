<text x="760" y="112" font-family="monospace" font-size="11" text-anchor="middle">CI</text>
<text x="850" y="149" font-family="monospace" font-size="11" text-anchor="middle">CD</text>
<text x="962" y="100" font-family="monospace" font-size="11" text-anchor="middle">IaC</text>
<text x="1080" y="142" font-family="monospace" font-size="11" text-anchor="middle">K8s</text>
<text x="790" y="216" font-family="monospace" font-size="11" text-anchor="middle">SLO</text>
<text x="908" y="248" font-family="monospace" font-size="11" text-anchor="middle">OPS</text>
<text x="1110" y="228" font-family="monospace" font-size="11" text-anchor="middle">AI</text>
<text x="840" y="294" font-family="monospace" font-size="10" text-anchor="middle">COST</text>
<text x="1000" y="296" font-family="monospace" font-size="11" text-anchor="middle">SEC</text>
</g>
