<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Meet Soni — Infrastructure, made intentional</title>
<desc id="desc">A dark engineering-console banner with a custom network map, signal paths, and platform engineering typography.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset=".55" stop-color="#101b2c"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9bb0c7" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect width="1200" height="360" rx="22" fill="url(#grid)"/>
<path d="M0 302H1200" stroke="#9bb0c7" stroke-opacity=".18"/>
<path d="M0 22Q0 0 22 0H1178Q1200 0 1200 22V54H0Z" fill="#ffffff" fill-opacity=".035"/>
<circle cx="28" cy="27" r="5" fill="#fb7185"/><circle cx="47" cy="27" r="5" fill="#fbbf24"/><circle cx="66" cy="27" r="5" fill="#a3e635"/>
<text x="92" y="32" font-family="monospace" font-size="12" letter-spacing="2" fill="#8da2b8">PLATFORM ENGINEERING / FIELD NOTES 001</text>
<text x="64" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4" fill="#67e8f9">MEET SONI</text>
<text x="62" y="168" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="43" fill="#f4f7fb">I make infrastructure</text>
<text x="62" y="216" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="43" fill="#f4f7fb">behave like a product.</text>
<text x="64" y="254" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#a8b7c9">Cloud platforms · Kubernetes · Delivery systems · Reliability</text>
<rect x="64" y="279" width="188" height="28" rx="14" fill="#67e8f9" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".5"/>
<circle cx="80" cy="293" r="4" fill="#a3e635" filter="url(#glow)"/>
<text x="92" y="297" font-family="monospace" font-size="11" letter-spacing="1" fill="#d8f6f8">BUILD / SHIP / LEARN</text>
<!-- network map -->
<g fill="none" stroke="#5c7895" stroke-width="1.5" stroke-opacity=".75">
<path d="M760 108L850 145L962 96L1080 138"/>
<path d="M760 108L790 212L908 244L962 96"/>
<path d="M850 145L908 244L1080 138L1110 224"/>
<path d="M790 212L840 294L1000 292L1110 224"/>
<path d="M908 244L1000 292L1080 138"/>
<path d="M850 145L840 294"/>
</g>
