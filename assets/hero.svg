<rect x="730" y="88" width="60" height="40" rx="8"/><rect x="820" y="125" width="60" height="40" rx="8"/>
<rect x="932" y="76" width="60" height="40" rx="8"/><rect x="1050" y="118" width="60" height="40" rx="8"/>
<rect x="760" y="192" width="60" height="40" rx="8"/><rect x="878" y="224" width="60" height="40" rx="8"/>
<rect x="1080" y="204" width="60" height="40" rx="8"/><rect x="810" y="274" width="60" height="32" rx="8"/>
<rect x="970" y="272" width="60" height="40" rx="8"/>
