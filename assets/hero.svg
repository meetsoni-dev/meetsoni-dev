<circle cx="760" cy="108" r="3"/><circle cx="850" cy="145" r="3"/><circle cx="962" cy="96" r="3"/><circle cx="1080" cy="138" r="3"/>
<circle cx="790" cy="212" r="3"/><circle cx="908" cy="244" r="3"/><circle cx="1110" cy="224" r="3"/><circle cx="840" cy="294" r="3"/><circle cx="1000" cy="292" r="3"/>
</g>
<text x="1135" y="334" font-family="monospace" font-size="10" text-anchor="end" fill="#607890">SYSTEMS THINKING, NOT TOOL COLLECTING.</text>
